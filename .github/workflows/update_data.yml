name: update_data

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Copiar los archivos del repositorio al servidor virtual
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Instalar el entorno de Python en la máquina virtual
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Instalar las dependencias necesarias de tu proyecto
    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install pandas plotly html5lib beautifulsoup4 requests dash

    # 4. Ejecutar tu script de Python para actualizar data.json
    - name: Ejecutar script de datos
      run: python app.py

    # 5. Guardar los cambios y subirlos automáticamente a tu rama principal
    - name: Hacer commit y push a GitHub Pages
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add *.csv index.html data.json grafico_animado.json
        # Solo sube si hay datos verdaderamente nuevos para evitar errores
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatizado: Actualización diaria de métricas" && git push)